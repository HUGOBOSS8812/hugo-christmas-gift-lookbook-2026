<style>

function spread(){return innerWidth/innerHeight>1.15&&innerWidth>900}

function fill(el){const k=el.dataset.k;if(k&&!el.dataset.ok&&IMG[k]){el.src=IMG[k];el.dataset.ok=1}}
function prime(i){for(let d=-2;d<=4;d++){const p=PGS[i+d];if(p)p.querySelectorAll('img[data-k]').forEach(fill)}}
function show(i,anim=true){i=Math.max(0,Math.min(N-1,i));const want=idxs(i);PGS.forEach((p,k)=>{const on=want.includes(k);p.classList.toggle('on',on);if(on&&anim){p.classList.remove('anim');void p.offsetWidth;p.classList.add('anim')}});cur=i;
document.getElementById('cnt').textContent=(want.length>1?(want[0]+1)+'–'+(want[1]+1):(want[0]+1))+' / '+N;const sl=document.getElementById('sl');sl.max=N;sl.value=want[0]+1;
document.getElementById('prev').disabled=want[0]===0;document.getElementById('next').disabled=want[want.length-1]>=N-1;fit();prime(cur);try{history.replaceState(null,'','#page-'+(want[0]+1))}catch(e){}}

addEventListener('hashchange',()=>{show(fromHash());closeAll()});
function closeAll(){document.querySelectorAll('.ovl').forEach(o=>o.classList.remove('on'));$('search').style.display='none'}
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#page-"]');if(a){e.preventDefault();show(+a.getAttribute('href').slice(6)-1);closeAll();return}
 if(e.target.closest('a.shop'))return;const sl_=e.target.closest('[data-look]');if(sl_){shopLook(+sl_.dataset.look);return}const c=e.target.closest('.c[data-id]');if(c&&!e.target.closest('.ovl'))zoomP(c.dataset.id)});
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=closeAll);
function zoomP(id){const p=P[id];$('zimg').src=IMG[p.k]||B;
 $('ztx').innerHTML=`<div class="k">${esc(p.line)}${p.capsule?' · '+esc(p.capsule):''}</div><h2>${esc(p.name)}</h2><div style="color:#6b6457">${esc(p.colour)}</div><table><tr><td>Product code</td><td>${esc(p.code)}</td></tr><tr><td>Colour</td><td>${esc(p.colour)}</td></tr><tr><td>Season</td><td>${esc(p.seasons)}</td></tr></table><div class="k" style="margin-bottom:6px">Sizes available</div><div class="szs">${p.sz.map(s=>`<i>${esc(s)}</i>`).join('')}</div>${shop(p,'shop big')}`;
 $('zov').classList.add('on')}
function shopLook(i){const pg=PG[i];$('zimg').src=IMG[P[pg.ids[0]].k]||B;
 $('ztx').innerHTML=`<div class="k">Shop the look · ${esc(pg.line)}</div><h2>${esc(pg.title)}</h2><div class="stll">${pg.ids.map(id=>{const p=P[id];return `<div class="stli"><img src="${IMG[p.k]||B}" alt=""><div><b>${esc(p.name)}</b><br><span>${esc(p.code)} · ${esc(p.colour)}</span><br>${shop(p)}</div></div>`}).join('')}</div>`;$('zov').classList.add('on')}
$('brandl').textContent=TT.toUpperCase();if(BR==='HUGO'){$('ghim').style.display='none';$('gher').style.display='none'}document.body.classList.add(BR.toLowerCase());
let built=false;$('tb').onclick=()=>{closeAll();const t=$('thumbs');if(!built){t.innerHTML=PGS.map((p,i)=>{const th=p.dataset.th;return `<a href="#page-${i+1}" class="${p.classList.contains('sec')?'sec '+(p.dataset.g||''):''}"><div ${th&&P[th]?`data-t="${P[th].k}"`:''}></div><b>${i+1}</b> ${p.dataset.title}</a>`}).join('');built=true;
 t.querySelectorAll('div[data-t]').forEach(d=>{const s=IMG[d.dataset.t];if(s)d.style.backgroundImage=`url('${s}')`})}
 t.querySelectorAll('a').forEach((a,i)=>a.classList.toggle('cur',idxs(cur).includes(i)));$('tov').classList.add('on')};
const SI=[];PGS.forEach((pg,i)=>pg.querySelectorAll('.c[data-id]').forEach(el=>SI.push({el,id:el.dataset.id,pg:i})));
$('sb').onclick=()=>{const b=$('search');const v=b.style.display==='block';closeAll();if(!v){b.style.display='block';$('q').focus()}};
$('q').oninput=e=>{const v=e.target.value.trim().toLowerCase();const seen=new Set();const r=v.length<2?[]:SI.filter(x=>{const p=P[x.id];if(seen.has(x.id))return false;const ok=(p.code+' '+p.name+' '+p.colour+' '+p.line+' '+p.capsule).toLowerCase().includes(v);if(ok)seen.add(x.id);return ok}).slice(0,60);
 $('sres').innerHTML=r.map(x=>{const p=P[x.id];return `<a href="#page-${x.pg+1}" data-id="${x.id}"><img src="${IMG[p.k]||B}" alt=""><div><b>${esc(p.code)}</b><br>${esc(p.name)} · ${esc(p.colour)}</div><span>p.${x.pg+1}</span></a>`}).join('')||(v.length>1?'<div style="padding:8px;color:#aaa">No match</div>':'')};
$('sres').addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;const id=a.dataset.id;setTimeout(()=>{document.querySelectorAll('.page.on .c[data-id="'+id+'"]').forEach(el=>{el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),2500)})},80)});
show(fromHash(),false);
</script></body></html>
